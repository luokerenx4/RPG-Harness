title: 妖刀奇譚 / Sengoku Raid
preset: ./preset/run.ts
modules:
  - ./modules/raid.ts

# This project-owned headless matrix is an acceptance test, not just telemetry.
# Missing a numeric threshold or required activity surface creates a
# reproducible coding issue at the frozen audit source checkpoint.
ai_audit:
  personas: [objective, greedy, charmer, rude, extractor, delver, completionist]
  # Random is a separate seeded survival lane: it must eventually finish, but
  # its intentional wandering does not dilute strategy pacing/diversity gates.
  fuzz_personas: [random]
  # Every seed is a separate fresh world. All must pass before sweep may issue
  # a project certificate; this keeps one lucky encounter sequence from hiding
  # a stochastic grind or soft lock.
  seeds: [1, 17, 2718, 65535, 38173]
  min_unique_endings: 2
  min_unique_decision_paths: 3
  # A route may revisit a semantic action, but no acceptance persona should
  # need to grind the same semantic activity kind more than this many times.
  max_activity_repetitions: 27
  # Combat actions are rounds, while movement is a route-level decision.
  # Budget them independently so a real navigation grind cannot hide behind
  # the intentionally multi-round battle loop.
  max_activity_repetitions_by_kind: { move: 22, attack: 30 }
  # These tags are observed on activities the lanes actually execute, not
  # inferred from persona names or merely available buttons. Together they
  # prove that the acceptance matrix reaches all three authored raid styles.
  required_activity_tags: [route/kuro_swamp, route/sumida_river, route/mt_houkyou, route/hell_gate]
  # A route tag proves that a lane entered the deep raid. Requiring this script
  # separately proves that at least one lane also built all three relationships
  # and reached their authored alliance scene before ending the campaign.
  required_scripts: [three_flowers_alliance]

switches:
  learnedChinkonho: { initial: false, label: 「鎮魂法」を習得 }
  learnedHayagake: { initial: false, label: 「早駆け」を習得 }
  # 澪の bond_mio_02 で伝授される「水鏡」。chinkonho / hayagake と
  # 対になる三つ目の邦絆技能フラグ。hell_gate chain の解錠は
  # knownSkills を直接読むが、他二技と揃える形でスイッチも立てる。
  learnedMizukagami: { initial: false, label: 「水鏡」を習得 }
  # Companion currently in party (one of three exclusive). invite:<id> sets
  # it and dismiss:<id> clears it; raid end also clears it. Read by raid menu
  # passives + onActionDispatch veto guard.
  companion_kagari: false
  companion_kasumi: false
  companion_mio: false
  # Persistent "ever survived a raid together" — gates the bond_*_03
  # script tier and unlocks the three_flowers_alliance trigger.
  befriended_kagari: { initial: false, label: 篝と一度、出帰りから生還 }
  befriended_kasumi: { initial: false, label: 霞と一度、出帰りから生還 }
  befriended_mio: { initial: false, label: 澪と一度、出帰りから生還 }
  # Met-mio flag for milestone triggers. Module also tracks via
  # metCharacters; this switch exists so trigger `when:` conditions
  # can compose against `switch:` predicates uniformly.
  mio_met: false
  # Letter 02 places 澪 under an official inspection duty: unlike an
  # ordinary companion, she can be invited before affection 4. The
  # reply to that order also schedules her immediately.
  mio_inspection_duty: false
  # Set when the pulse system has been introduced (after first victory).
  pulse_intro_seen: false
  # 第三章「最後の御沙汰」での三択。一つだけ true になる。
  # 三つ揃って false なら letter_03 をまだ受け取っていない。
  chose_court_loyal:  false   # 公儀に服す
  chose_court_defy:   false   # 公儀に刀を抜く
  chose_court_silent: false   # 黙して退く（隠遁）
  # 三花の盟 — 三人とも befriended なら milestone trigger 経由で誓う
  three_flowers_pledged: false
  # Preserve which words formed the pledge. Legacy saves only have the
  # generic flag above and intentionally fall back to the original coda.
  three_flowers_stay_pledge: false
  three_flowers_death_pledge: false
  # 同行道中の一幕 — 各同行者と初めて静かな新 zone に着いた時に一度だけ
  # 流れる road_<id> シーンを観たら立つ。moveHandler が switch を見て
  # 再発火を防ぐ（シーンの effects ブロック自身が立てる）。
  road_kagari_seen: { initial: false, label: 篝との最初の道中を経験 }
  road_kasumi_seen: { initial: false, label: 霞との最初の道中を経験 }
  road_mio_seen:    { initial: false, label: 澪との最初の道中を経験 }
  # 同行道中の二幕目 — befriended（一度生還を共にした）後に解錠される、より
  # 踏み込んだ道中シーン road_<id>_2。一幕目を観た後の静かな zone で流れる。
  road_kagari_2_seen: { initial: false, label: 篝と再び道中を共にする }
  road_kasumi_2_seen: { initial: false, label: 霞と再び道中を共にする }
  road_mio_2_seen:    { initial: false, label: 澪と再び道中を共にする }

variables:
  # Raid counters — incremented by endRaidExtract / endRaidFailure.
  raidsCompleted: { type: number, initial: 0 }
  raidsFailed:    { type: number, initial: 0 }
  # 将軍家からの密書 — chapter is the current main-line progress index
  # (0 = intro, 1/2/3 = letter milestones). last_directive is the text
  # the hub UI shows under "御沙汰" when between letters.
  shogun_chapter:  { type: number, initial: 0 }
  last_directive:  { type: string, initial: "鬼を斬り、骸を持ち帰れ。" }
  # Stable memories of the player's early replies to each field companion.
  # Empty means a legacy save whose exact choice cannot be recovered safely.
  kagari_first_reply: { type: string, initial: "" }
  kasumi_first_reply: { type: string, initial: "" }
  kagari_bond_reply: { type: string, initial: "" }
  kasumi_bond_reply: { type: string, initial: "" }
  kasumi_deer_reply: { type: string, initial: "" }
  kasumi_final_reply: { type: string, initial: "" }
  mio_inquest_reply: { type: string, initial: "" }
  mio_mirror_reply: { type: string, initial: "" }
  kagari_sleep_reply: { type: string, initial: "" }
  kagari_rain_reply: { type: string, initial: "" }
  # 情報屋 — intel_active is the briefing text injected at raid start;
  # consumed (cleared) once the raid begins.
  intel_active:    { type: string, initial: "" }
  intel_count:     { type: number, initial: 0 }
  # 妖刀の業 — pulse counts per path. Each victory the player picks
  # which pulse absorbs the demon's remnant. Counters gate endings
  # and the hidden hell-gate map.
  pulse_pure:      { type: number, initial: 0 }
  pulse_oni:       { type: number, initial: 0 }
  pulse_mundane:   { type: number, initial: 0 }
  # Companion downed in current raid — resets on raid end. Read by
  # composite triggers and end-screen narrations.
  companion_downed: { type: number, initial: 0 }
