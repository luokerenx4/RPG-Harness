id: mt_houkyou_lava_vent
name: 噴気孔
chain: mt_houkyou
difficulty: 3
bg: assets/backgrounds/houkyou-caldera
encounter_table:
  - { enemy: oni_warrior, weight: 100 }
loot_table:
  - { item: soul_shard, min: 2, max: 4, weight: 70 }
  - { item: oni_horn, min: 1, max: 1, weight: 30 }
placements:
  - id: kasumi_spawn
    at: [0, 0]
    visible: false
    resource: { kind: character, id: kasumi }
    events:
      - { id: encounter, trigger: "sengoku-raid:spawn", chance: 1.0, run: { kind: script, id: encounter_kasumi_first } }
  - id: exit_mt_houkyou_caldera
    at:
      - 0
      - 0
    resource:
      kind: map
      id: mt_houkyou_caldera
    collision: trigger
    events:
      - id: move
        trigger: manual
        label: 奥
        order: 0
  - id: exit_mt_houkyou_stone_paths
    at:
      - 0
      - 0
    resource:
      kind: map
      id: mt_houkyou_stone_paths
    collision: trigger
    events:
      - id: move
        trigger: manual
        label: 戻る
        order: 1
