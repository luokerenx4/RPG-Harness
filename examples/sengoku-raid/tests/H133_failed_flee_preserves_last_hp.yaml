    raid:
      chain: sumida_river
      entryMapId: sumida_river_bridge_foot
      turnsTaken: 4
      pendingLoot: { oni_horn: 1 }
      visited:
        sumida_river_drowned_shrine:
          visited: true
          searched: true
          encounter:
            enemyId: oni_warrior
            enemyHp: 8
            enemyHpMax: 18
          encounterCleared: false
          pendingLoot: {}
