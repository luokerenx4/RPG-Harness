      algorithm: mulberry32
      state: 7
  baseline:
    completedScripts: [000_intro]
    currentMapId: sumida_river_drowned_shrine
    weapons:
      ancestor_yaodao: { power: 6 }
    characters:
      player:
        stats:
          hp: 3
          mental: 4
          spectral: 79
          intellect: 20
        custom: {}
  sengoku-raid:
