name: invite_kagari は同行だけを行い、次の公開操作を dismiss に替える
description: |
  Affection 4 で invite すると companion_kagari が立ち、m.companion と HP が
  セットされる。同行後の逆操作は同じ ID の toggle ではなく、意図が安定した
  dismiss:kagari として GUI / Headless の両方に公開される。
state:
  baseline:
    completedScripts:
      - 000_intro
    characters:
      kagari:
        stats:
          affection: 4
  sengoku-raid:
    metCharacters:
      - kagari
    raid: null
    companion: null
    companionHp: 0
inputs:
  - type: doActivity
    id: invite:kagari
  - type: next
assertions:
  - kind: state
    path: baseline.switches.companion_kagari
    eq: true
  - kind: state
    path: sengoku-raid.companion
    eq: kagari
  - kind: state
    path: sengoku-raid.companionHp
    eq: 10
  - kind: activity
    id: dismiss:kagari
    present: true
    available: true
    titleIncludes: 同行から外す
  - kind: activity
    id: invite:kagari
    present: false
