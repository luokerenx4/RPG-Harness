name: 霞の「鹿の道」が単独で朝の山道を指定する
description: |
  bond_kasumi_03 can be dispatched directly from the Edo-castle hub. It must
  stage its own morning mountain path instead of inheriting the hub backdrop.
state:
  baseline:
    completedScripts:
      - 000_intro
    characters:
      kasumi:
        stats: { affection: 6 }
    switches:
      befriended_kasumi: true
    visuals:
      bg: assets/backgrounds/edo-castle
      portraits: {}
      cg: null
  sengoku-raid:
    raid: null
    metCharacters:
      - kasumi
inputs:
  - type: doActivity
    id: script:bond_kasumi_03
assertions:
  - kind: state
    path: baseline.visuals.bg
    eq: assets/backgrounds/mountain-path-morning
