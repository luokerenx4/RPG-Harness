name: 提案B：同行者の attack veto は一度語られ、その後公開 action を lock する
description: |
  Seed a raid encounter with companionHp=2. Dispatch attack — the
  first-wins onActionDispatch hook returns "cancel", so the attack handler
  never runs. The first refusal remains visible narration; the following Hub
  makes attack and sneak_strike unavailable with a reason, preventing an AI
  from repeating an accepted-but-cancelled action forever.
state:
  baseline:
    completedScripts:
      - 000_intro
    weapons:
      ancestor_yaodao:
        power: 8
    characters:
      player:
        stats:
          hp: 30
          mental: 8
          spectral: 30
          intellect: 5
      kagari:
        stats:
          affection: 6
    switches:
      companion_kagari: true
    currentMapId: kuro_swamp_ruined_hut
  sengoku-raid:
    metCharacters:
      - kagari
    companion: kagari
    companionHp: 2
    raid:
      chain: kuro_swamp
      entryMapId: kuro_swamp_edge
      turnsTaken: 3
      pendingLoot: {}
      visited:
        kuro_swamp_ruined_hut:
          visited: true
          searched: false
          encounter:
            enemyId: oni_lesser
            enemyHp: 8
            enemyHpMax: 8
          encounterCleared: false
          pendingLoot: {}
inputs:
  - type: doActivity
    id: attack
  - type: next
assertions:
  - kind: state
    path: sengoku-raid.raid.visited.kuro_swamp_ruined_hut.encounter.enemyHp
    eq: 8
  - kind: state
    path: baseline.characters.player.stats.spectral
    eq: 30
  - kind: state
    path: sengoku-raid.raid.companionAttackRefused
    eq: true
  - kind: activity
    id: attack
    available: false
    lockedReasonIncludes: 重傷
  - kind: activity
    id: sneak_strike
    available: false
    lockedReasonIncludes: 撤退せよ
  - kind: activity
    id: flee
    available: true
