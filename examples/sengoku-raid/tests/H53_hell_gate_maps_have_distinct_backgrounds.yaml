name: every Hell Gate zone replaces the pre-raid background
state:
  baseline:
    completedScripts: [000_intro]
    currentMapId: hell_gate_mouth
    visuals:
      bg: assets/backgrounds/edo-castle
      portraits: {}
      cg: null
  sengoku-raid:
    metCharacters: []
    raid:
      chain: hell_gate
      entryMapId: hell_gate_mouth
      turnsTaken: 0
      pendingLoot: {}
      visited:
        hell_gate_mouth:
          visited: true
          searched: true
          encounter: null
          encounterCleared: true
          pendingLoot: {}
        hell_gate_corridor:
          visited: true
          searched: true
          encounter: null
          encounterCleared: true
          pendingLoot: {}
        hell_gate_mirror_pool:
          visited: true
          searched: false
          encounter: null
          encounterCleared: true
          pendingLoot: {}
inputs:
  - { type: doActivity, id: "move:hell_gate_corridor" }
  - { type: next }
  - { type: doActivity, id: "move:hell_gate_mirror_pool" }
assertions:
  - kind: state
    path: baseline.currentMapId
    eq: hell_gate_mirror_pool
  - kind: state
    path: baseline.visuals.bg
    eq: assets/backgrounds/hell-gate-mirror-pool
