name: bond_kagari_01 在亲密度不足时显示自然提示并保留机器条件
description: |
  After meeting kagari (intro + encounter_kagari_first complete), but
  before giving any gifts, bond_kagari_01 should appear in the hub
  with available=false and a player-facing lockedReason naming the affection
  gap. The exact condition stays on the activity for Headless planning.
state:
  baseline:
    completedScripts:
      - 000_intro
      - encounter_kagari_first
    characters:
      kagari:
        affection: 1
        custom: {}
  sengoku-raid:
    raid: null
    metCharacters:
      - kagari
inputs: []
assertions:
  - kind: activity
    id: script:bond_kagari_01
    available: false
    lockedReasonIncludes: 篝の親密度 2 以上（現在 1）
    requires: { affection: { character: kagari, min: 2 } }
