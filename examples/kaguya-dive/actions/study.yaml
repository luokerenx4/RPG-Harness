id: study
title: 上课 / 听讲座
description: 工学课、神经接口讲座。稳扎稳打。
category: study
slot: any
cost: 1
whenIn: [lab]
effects:
  stats: { engineering: 6, neuroscience: 2, stamina: -1 }
narrations:
  - 礼堂里全是 PPT 的反光。你把每个公式都抄进义体设计本第三册。
  - 工学课上你在公式旁边画了一段五线谱。教授没看见。
  - 神经接口讲座第三排有人睡着了。你没。
  - 课间你问了一个问题。对面那个总坐前排的男生笑了一下，但没解释为什么笑。
  - 今天讲到细胞膜的电压门控通道。你在笔记本上写了一句"她的声音也是这样传出来的吗"，然后划掉了。
  - 实验楼晚上九点关灯。你说还没记完。保安说我也没办法。
  - 你在工学馆楼梯间遇到一只猫。它看了你一眼，没躲，也没走。
  - 教授引用了一句你高中学过的物理。你愣了半秒——是他还是你站错了课堂。
  - 课结束你最后一个出来。樱花全谢了，路灯亮着。
