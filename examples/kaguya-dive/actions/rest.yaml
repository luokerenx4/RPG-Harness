id: rest
title: 休息
description: 回心力。仅此而已。
category: rest
slot: any
cost: 1
whenIn: [town]
effects:
  stats: { stamina: 6 }
narrations:
  - 你睡到中午。醒来时枕头湿了一小片。
  - 你倒在床上没刷牙。犬DOGE 跳上来，把头贴在你颈窝那里。她的电池在很轻地响。
  - 你没睡。坐在窗边看到天亮。东京六点半的光跟你高中那时一模一样。
  - 中午醒来，公寓里很安静。冰箱压缩机循环了两次，你才想起来今天是周末。
  - 你睡着的时候做了一个梦——是辉夜，但说话的方式像八千代。你醒来差一点哭出来。
  - 你睡了十二个小时。醒来发现真实从门缝塞了一张纸条："肉酱意面在冰箱。"
