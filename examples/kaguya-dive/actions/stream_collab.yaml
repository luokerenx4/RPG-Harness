id: stream_collab
title: 直播协作 · 给八千代做物料
description: 写词 / 调音 / 弹幕监督。表面上是日常协助。（保热度的唯一手段）
category: social
slot: any
cost: 1
whenIn: [cyber]
requires:
  stat: { name: stamina, min: 1 }
effects:
  stats: { heat: 8, funds: 3, stamina: -1 }
  affection: { kaguya: 1 }
narrations:
  - 你给八千代这场直播写了一段间奏歌词。她念出来时停了半拍。后台数据条往上抬了一点。X 那边的曲线没怎么变。
  - 你做这场直播的视觉。BG 用了你高中那本歌词草稿里夹的樱花瓣的照片。弹幕里有人问那是哪儿的樱花，没人回答。
  - 你今天负责弹幕监督。两个小时里 X 的频道也直播了一会，弹幕里有人开始横跳。八千代没提。你也没提。
  - 你给她做了一首新歌的 demo。她试唱了三遍。第三遍她说"我能不能慢一点。" 你说慢就慢。后台听众没散。
  - 直播后段她唱了一首老歌。你没问她从哪记的——你心里知道那是 8000 年前你想给她的旋律。
  - 今晚弹幕里多了一些奇怪的留言：「这个声音和某个旧账号好像」。八千代笑了一下，说「我换过号。」弹幕信了。你不放心。
