id: work
title: 打工
description: 24h 便利店收银。回血，回钱，不回心。
category: work
slot: any
cost: 1
whenIn: [town]
effects:
  stats: { funds: 12, stamina: -1 }
narrations:
  - 又是一个夜班。冷藏柜的嗡嗡声盖过了你心里那段旋律。
  - 凌晨两点。一个上班族进来买啤酒，结账时手在抖。你说"请收好"，他没抬头。
  - 货架补完，关东煮汤的味道飘了一整夜。你想起来你今晚没吃饭。
  - 来了一个总在这个时段买同一款饭团的客人。今天她换了。你心里"哦"了一下，没问。
  - 收银机第二次卡纸。你给经理发短信。十秒后他回："明早换台新的。撑一下。"你撑了。
  - 一个高中生在杂志架前站了快十分钟。她最后什么也没买就走了。你认识那种站法。
  - 凌晨四点门铃响。是同一个送货员。他递东西时笑了一下：「你今天又上夜班。」你说嗯。他没多问。
