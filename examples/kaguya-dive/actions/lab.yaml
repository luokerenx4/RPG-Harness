narrations:
  - 凌晨四点，电烙铁在你手里第六次发烫。指端神经丝刚刚响应了一次脉冲。
  - 你把第三层皮肤导电涂料刷上去，干了二十分钟。表面的反光跟她脸颊的反光不太对，你又刮了。
  - 神经接口测试仪报警。你查了半小时，发现是供电线松了。便宜地解决了一次焦虑。
  - 你跟旁边那台 3D 打印机僵持到天亮——它的喷头堵了三次。你修了三次。
  - 助教今天来收实验报告。她翻了两页，问"你写这个干什么"。你说作业。她"哦"了一声没追问。
  - 烙铁烫到你左手食指。你愣了一下，继续焊。半夜，没人。
